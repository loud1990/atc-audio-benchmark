version: 1
use_scope: public_repository
description: >-
  Distinct real U.S. ATC recordings used by the 25-scenario regional showcase.
  Geographic diversity is documented here; speaker accent or dialect labels are not inferred.

rights:
  status: public_domain_us
  note: >-
    The source recordings are identified as FAA works published by Wikimedia Commons or in
    NTSB public dockets. NTSB states that public-docket content prepared by U.S. Government
    employees as part of official duties is not subject to copyright unless otherwise noted.
    No source used here was marked as third-party copyrighted material. Users should review
    the linked source pages before redistributing outside the United States.
  ntsb_policy: https://www.ntsb.gov/about/Pages/Website-Policies.aspx
  us_copyright_105: https://www.copyright.gov/title17/92chap1.html#105

clip_preparation:
  output_format: mono 16 kHz PCM16 WAV
  silence_compaction_threshold_db: -36
  minimum_removed_silence_sec: 0.40
  retained_silence_sec: 0.12
  target_duration_sec: 75
  minimum_accepted_duration_sec: 60

sources:
